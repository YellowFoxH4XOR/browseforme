<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Composer fixture</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #eee; }
    nav { display: flex; flex-direction: column; gap: 8px; width: 160px; }
    [role="dialog"] { position: fixed; inset: 10%; background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 8px 32px rgba(0,0,0,.25); }
    [role="textbox"] { min-height: 96px; border: 1px solid #ccc; border-radius: 8px; padding: 8px; margin-bottom: 12px; }
    button { padding: 8px 16px; border-radius: 999px; }
  </style>
</head>
<body>
  <nav>
    <a href="#" aria-label="Post">Post</a>
    <button>Home</button>
  </nav>
  <div role="dialog" aria-modal="true" style="position:fixed;inset:10%;background:#fff">
    <div id="composer" contenteditable="true" role="textbox" aria-label="Post text"></div>
    <button id="schedule">Schedule</button>
    <button id="post" disabled>Post</button>
  </div>
  <script>
    const composer = document.getElementById("composer");
    const post = document.getElementById("post");
    composer.addEventListener("input", () => {
      post.disabled = composer.textContent.trim().length === 0;
    });
    post.addEventListener("click", () => {
      const text = composer.textContent;
      document.body.textContent = "posted: " + text;
    });
  </script>
</body>
</html>
